<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Game 🍓</title>
  <link rel="stylesheet" href="game_style.css" />
</head>

<body>

  <div class="top-ui">
    <button id="start-btn">GAME START</button>
    <div id="score">SCORE : 0</div>
    <div id="timer">TIME : 15</div>
  </div>

  <div id="game-message">
    フルーツをタップしてスコアを稼ごう！
  </div>

  <div class="grid">
    <div class="fruit-card" data-emoji="🍓">🍓</div>
    <div class="fruit-card" data-emoji="🍊">🍊</div>
    <div class="fruit-card" data-emoji="🍇">🍇</div>
    <div class="fruit-card" data-emoji="🍎">🍎</div>
    <div class="fruit-card" data-emoji="🍌">🍌</div>
    <div class="fruit-card" data-emoji="🍋">🍋</div>
    <div class="fruit-card" data-emoji="🍑">🍑</div>
    <div class="fruit-card" data-emoji="🥝">🥝</div>
    <div class="fruit-card" data-emoji="🍍">🍍</div>
    <div class="fruit-card" data-emoji="🍉">🍉</div>
  </div>

  <script src="game_script.js"></script>

</body>
</html>
